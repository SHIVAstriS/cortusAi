
<div class="form-section">

  <div class="selected-slot">
    <p class="form-heading">Your appointment</p>

    <p>
      {{ selectedDate | date:'EEEE, MMMM d, y' }}
    </p>

    <p>{{ selectedTime }}</p>
  </div>

  <div *ngIf="!bookingConfirmed">

    <h3>Your Details</h3>

    <form #bookingForm="ngForm"
          (ngSubmit)="confirmBooking(bookingForm)">

      <div class="form-group">
        <label>Your Name *</label>
        <input
          type="text"
          name="name"
          placeholder="Jane Doe"
          [(ngModel)]="formData.name"
          required>
      </div>

      <div class="form-group">
        <label>Your Email *</label>
        <input
          type="email"
          name="email"
          placeholder="jane@company.com"
          [(ngModel)]="formData.email"
          required
          email>
      </div>

      <div class="form-group">
        <label>Mobile Number *</label>
        <input
          type="tel"
          name="mobile"
          placeholder="+91 98765 43210"
          [(ngModel)]="formData.mobile"
          required
          pattern="[0-9+ ]{10,15}">
      </div>

      <div class="form-group">
        <label>What would you like to discuss? *</label>
        <textarea
          name="message"
          rows="4"
          placeholder="e.g. We need a customized booking platform for our hotel."
          [(ngModel)]="formData.message"
          required>
        </textarea>
      </div>

      <button
        type="submit"
        class="confirm-button"
        [disabled]="bookingForm.invalid">

        Confirm Booking

      </button>

    </form>

  </div>

  <div class="confirmation" *ngIf="bookingConfirmed">
    <h3>Thank you!</h3>
    <p>Your booking details have been captured successfully.</p>
    <p>Selected date: {{ selectedDate | date:'mediumDate' }}</p>
    <p>Selected time: {{ selectedTime }}</p>
  </div>

</div>
